allowBuilds:
  esbuild: true
# pnpm 10 reads dependency overrides from here (the "pnpm.overrides" field in
# package.json is ignored by pnpm >=10). Values mirror package.json — keep in sync.
overrides:
  "@babel/core": ^7.29.6
  ajv: ^6.14.0
  # >=1.1.21 / >=2.1.7 fix GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7
  flatted: ^3.4.2
  # >=4.3.2 fixes GHSA-2883-xcg3-v3hh (maxTotalMergeKeys doesn't limit CPU
  # use for empty merge sources)
  js-yaml: ^4.3.2
  linkify-it: ^5.0.2
  markdown-it: ^14.2.0
  "minimatch@3": ^3.1.4
  "minimatch@9": ^9.0.7
  nanoid: ^3.3.18
  picomatch: ^4.0.4
  postcss: ^8.5.23
  react-router: ^8.3.0
  rollup: ^4.59.0
  # Security patches for transitive deps flagged by Dependabot (Sep 2026)
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  "@humanfs/node": '>=0.16.8'
  # Dedupe: tiptap 3.30's own prosemirror-model export is newer than the
  # one prosemirror-commands still pins, which otherwise leaves two
  # incompatible copies of the Node/NodeSpec types in the tree and breaks
  # tsc (see the same fix in SA-Platform-UI).
  prosemirror-model: ^1.25.11
